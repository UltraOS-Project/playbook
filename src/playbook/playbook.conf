<?xml version="1.0" encoding="utf-8"?>
<Playbook>
        <Name>UltraOS</Name>
        <Username>UltraOS</Username>
        <Title>UltraOS v1.1.0</Title>
        <ShortDescription>UltraOS Playbook for Windows 11 24H2 - 26H2</ShortDescription>
        <Description><![CDATA[╭───────────────── ⚠️ 𝗖𝗿𝗶𝘁𝗶𝗰𝗮𝗹 ⚠️ ─────────────────╮
│   Read the UltraOS documentation first.            │
│   https://github.com/UltraOS-Project/playbook       │
╰──────────────────────────────────────────────────────╯

UltraOS makes Windows snappier, more private and more yours - with Safe, Balanced and Extreme presets, full backups and an install report.]]></Description>
        <Details>A transparent and lightweight modification for Windows 11 26H2 (also 24H2/25H2), designed to optimize performance, privacy and usability - with rollback support and a post-install report.</Details>
        <ProgressText><![CDATA[UltraOS is backing up your current state, applying your chosen preset and generating an install report. A System Restore point may be created first if you selected it. You can review every change afterwards in C:\Windows\UltraOS\install-report.html]]></ProgressText>
        <Version>1.1.0</Version>
        <SupportedBuilds>
                <!-- 24H2 -->
                <string>26100</string>
                <!-- 25H2 -->
                <string>26200</string>
                <!-- 26H2 (Windows 11 2026 Update) -->
                <string>26300</string>
        </SupportedBuilds>
        <UpgradableFrom>any</UpgradableFrom>
        <Requirements>
                <Requirement>DefenderToggled</Requirement>
                <Requirement>NoAntivirus</Requirement>
                <Requirement>Internet</Requirement>
                <Requirement>NoPendingUpdates</Requirement>
                <Requirement>PluggedIn</Requirement>
        </Requirements>
        <UniqueId>00000000-0000-4000-556c-7472614f5321</UniqueId>
        <InstallGuide>https://github.com/UltraOS-Project/playbook/blob/main/docs/INSTALL.md</InstallGuide>
        <Overhaul>true</Overhaul>
        <UseKernelDriver>false</UseKernelDriver>
        <AllowUnsupportedUpgrades>false</AllowUnsupportedUpgrades>
        <ProductCode>64</ProductCode>
        <EstimatedMinutes>8</EstimatedMinutes>
        <Git>https://github.com/UltraOS-Project/playbook</Git>
        <Website>https://github.com/UltraOS-Project</Website>
        <DonateLink>https://github.com/UltraOS-Project</DonateLink>
        <SupportsISO>true</SupportsISO>
        <OOBE>
                <BulletPoints>
                        <BulletPoint Icon="Rocket" Title="Performance"
                        Description="By removing background bloat, telemetry and unneeded services - with honest tweaks only, no placebos."/>
                        <BulletPoint Icon="Privacy" Title="Privacy"
                        Description="By eliminating most of Microsoft's tracking, ads and AI data collection, verified against Windows 11 26H2."/>
                        <BulletPoint Icon="Lock" Title="Control"
                        Description="Safe, Balanced and Extreme presets, a System Restore point, full backups, one-click undo and an install report of every change."/>
                </BulletPoints>
                <Internet>Force</Internet>
        </OOBE>
        <ISO>
                <DisableBitLocker>true</DisableBitLocker>
                <DisableHardwareRequirements>true</DisableHardwareRequirements>
        </ISO>
        <Software>
                <Package Option="browser-brave" DefaultWebBrowser="true">
                        <Name>brave</Name>
                        <Title>Brave</Title>
                        <Description>Brave is a free, open-source, privacy-focused browser based on Chromium. Recommended by UltraOS.</Description>
                        <Icon>brave.png</Icon>
                </Package>
                <Package Option="browser-firefox" DefaultWebBrowser="true">
                        <Name>firefox</Name>
                        <Title>Firefox</Title>
                        <Description>Firefox is a free, open-source browser developed by the Mozilla Foundation, known for privacy and customizability.</Description>
                        <Icon>firefox.png</Icon>
                </Package>
                <Package Option="browser-librewolf" DefaultWebBrowser="true">
                        <Name>librewolf</Name>
                        <Title>LibreWolf</Title>
                        <Description>LibreWolf is a privacy- and security-focused browser fork of Firefox, with telemetry stripped out.</Description>
                        <Icon>librewolf.png</Icon>
                </Package>
        </Software>
        <FeaturePages>
                <RadioPage IsRequired="true" DefaultOption="preset-balanced" Description="Choose how aggressive UltraOS should be. Not sure? Balanced is the recommended daily-driver preset. Everything is reversible - the UltraOS folder lets you toggle anything afterwards.">
                        <Options>
                                <RadioOption>
                                        <Text>Safe - disable only (recommended for first-timers)</Text>
                                        <Name>preset-safe</Name>
                                </RadioOption>
                                <RadioOption>
                                        <Text>Balanced - recommended (default)</Text>
                                        <Name>preset-balanced</Name>
                                </RadioOption>
                                <RadioOption>
                                        <Text>Extreme - maximum debloat and performance</Text>
                                        <Name>preset-extreme</Name>
                                </RadioOption>
                        </Options>
                        <BottomLine Text="What does each preset change?" Link="https://github.com/UltraOS-Project/playbook/blob/main/docs/MODULES.md"/>
                </RadioPage>
                <RadioPage IsRequired="true" DefaultOption="rp-on" Description="UltraOS can create a System Restore Point before any change is made.">
                        <TopLine Text="Strongly recommended - enables instant rollback from Windows Recovery."/>
                        <Options>
                                <RadioOption>
                                        <Text>Create System Restore Point (recommended)</Text>
                                        <Name>rp-on</Name>
                                </RadioOption>
                                <RadioOption>
                                        <Text>Skip restore point</Text>
                                        <Name>rp-off</Name>
                                </RadioOption>
                        </Options>
                        <BottomLine Text="UltraOS also writes full backups to C:\Windows\UltraOS\Backups either way."/>
                </RadioPage>
                <RadioPage IsRequired="true" DefaultOption="wu-auto" Description="Choose how Windows Updates are handled after installation.">
                        <TopLine Text="Security updates matter - UltraOS never fully disables updates."/>
                        <Options>
                                <RadioOption>
                                        <Text>Automatic Windows Updates (recommended)</Text>
                                        <Name>wu-auto</Name>
                                </RadioOption>
                                <RadioOption>
                                        <Text>Notify only - I install updates manually</Text>
                                        <Name>wu-notify</Name>
                                </RadioOption>
                        </Options>
                        <BottomLine Text="Changeable later in the UltraOS folder." Link="https://github.com/UltraOS-Project/playbook/blob/main/docs/FAQ.md"/>
                </RadioPage>
                <CheckboxPage IsRequired="true" Description="Advanced options - only enable these if you understand the trade-offs: they reduce security or compatibility in exchange for control or performance. All of them can be toggled in the UltraOS folder after installation.">
                        <Options>
                                <CheckboxOption>
                                        <Text>Remove Microsoft Edge (a browser can be installed next)</Text>
                                        <Name>opt-uninstall-edge</Name>
                                </CheckboxOption>
                                <CheckboxOption>
                                        <Text>Keep Defender disabled (not recommended)</Text>
                                        <Name>opt-disable-defender</Name>
                                </CheckboxOption>
                                <CheckboxOption>
                                        <Text>Disable CPU mitigations (older CPUs only)</Text>
                                        <Name>opt-disable-mitigations</Name>
                                </CheckboxOption>
                                <CheckboxOption>
                                        <Text>Disable Core Isolation / VBS (not recommended)</Text>
                                        <Name>opt-disable-vbs</Name>
                                </CheckboxOption>
                        </Options>
                </CheckboxPage>
                <CheckboxPage IsRequired="true" Description="Additional options - safe to enable for most users. All of them can be toggled in the UltraOS folder after installation.">
                        <Options>
                                <CheckboxOption>
                                        <Text>Maximum Performance power scheme (no power saving)</Text>
                                        <Name>opt-max-performance</Name>
                                </CheckboxOption>
                                <CheckboxOption>
                                        <Text>Disable Hibernation</Text>
                                        <Name>opt-disable-hibernation</Name>
                                </CheckboxOption>
                                <CheckboxOption>
                                        <Text>Strip Recall / AI snapshot features</Text>
                                        <Name>opt-strip-recall</Name>
                                </CheckboxOption>
                                <CheckboxOption>
                                        <Text>Disable the Sticky Keys shortcut (pressing Shift 5 times)</Text>
                                        <Name>opt-disable-sticky-keys</Name>
                                </CheckboxOption>
                        </Options>
                </CheckboxPage>
                <CheckboxPage IsRequired="true" Description="Tuning extras - each has a real trade-off, so they stay off by default. Pick what fits your machine; hover descriptions live in the docs and everything is reversible.">
                        <Options>
                                <CheckboxOption>
                                        <Text>Disable SysMain / Superfetch (fast NVMe + 16 GB RAM or more)</Text>
                                        <Name>opt-disable-sysmain</Name>
                                </CheckboxOption>
                                <CheckboxOption>
                                        <Text>Disable Windows Search indexing (file search gets slower)</Text>
                                        <Name>opt-disable-search-indexing</Name>
                                </CheckboxOption>
                                <CheckboxOption>
                                        <Text>Disable memory compression (16 GB RAM or more)</Text>
                                        <Name>opt-disable-memory-compression</Name>
                                </CheckboxOption>
                                <CheckboxOption>
                                        <Text>Disable hardware-accelerated GPU scheduling (situational)</Text>
                                        <Name>opt-disable-hags</Name>
                                </CheckboxOption>
                        </Options>
                </CheckboxPage>
                <RadioImagePage CheckDefaultBrowser="true" DependsOn="software" DefaultOption="browser-brave" Description="Select your preferred browser. It will be installed and set as default. Browser settings are not modified. Choose 'None' to keep your current browsers.">
                        <Options>
                                <RadioImageOption None="true"/>
                                <RadioImageOption>
                                        <Text>Brave</Text>
                                        <Name>browser-brave</Name>
                                        <FileName>brave</FileName>
                                        <GradientTopColor>#392DD1</GradientTopColor>
                                        <GradientBottomColor>#A91B78</GradientBottomColor>
                                </RadioImageOption>
                                <RadioImageOption>
                                        <Text>Firefox</Text>
                                        <Name>browser-firefox</Name>
                                        <FileName>firefox</FileName>
                                        <GradientTopColor>#FF3647</GradientTopColor>
                                        <GradientBottomColor>#FFC742</GradientBottomColor>
                                </RadioImageOption>
                                <RadioImageOption>
                                        <Text>LibreWolf</Text>
                                        <Name>browser-librewolf</Name>
                                        <FileName>librewolf</FileName>
                                        <GradientTopColor>#057DB6</GradientTopColor>
                                        <GradientBottomColor>#86D8FF</GradientBottomColor>
                                </RadioImageOption>
                        </Options>
                </RadioImagePage>
        </FeaturePages>
</Playbook>
