---
title: Remove Bloatware Apps
description: >-
  Removes deprecated and unwanted AppX packages per preset tier (Safe = dead apps
  only, Balanced = Atlas-parity minus usability losses, Extreme = aggressive set
  with warnings) and deprovisions every removed family so Windows feature updates
  cannot reinstall them. Almost everything removed here is Store-reinstallable -
  see research/debloat-apps-research.md §9 and the install report for Store IDs.
onUpgrade: false
actions:
  # =====================================================================================
  # NEVER-REMOVE dependency families (T1-e §5.8). Removing any of these breaks the
  # Store, winget, WebView2-dependent apps, Xbox sign-in or the OS shell. The local
  # validator (scripts/validate-playbook.py PROTECTED_APPX) also refuses the core ones:
  #   Microsoft.WindowsStore*          - reinstalling anything (the undo path) needs it
  #   Microsoft.DesktopAppInstaller    - provides winget (rollback + reinstall)
  #   Microsoft.Web.WebView2 (win32)   - runtime for Outlook/Widgets/Xbox/Photos edit
  #                                      and many 3rd-party apps (T1-h §4.2 list)
  #   Microsoft.VCLibs.140* / Microsoft.NET.Native.* / Microsoft.UI.Xaml.*
  #   / Microsoft.WindowsAppRuntime.1_* - frameworks used by dozens of inbox apps
  #   Microsoft.XboxIdentityProvider*  - Microsoft-account sign-in for games (winutil:
  #                                      "may break Microsoft account sign-in")
  #   Microsoft.Xbox.TCUI*             - MSA auth in games that do not need the Xbox app
  #   MicrosoftWindows.Client.CBS, *StartMenuExperienceHost*, *ShellExperienceHost*,
  #   *Windows.Search*, Microsoft.Windows.FileExplorer, Microsoft.Windows.InputApp,
  #   Microsoft.Windows.SecHealthUI     - OS-critical / non-removable shell components
  # Usability defaults we keep until Extreme: Calculator, Photos, Notepad, Paint,
  # Terminal, Media Player, Snipping Tool. (winutil default-removes Calculator and
  # Photos - we deliberately do NOT copy that; T1-e §5.1 "keep" rows.)
  # =====================================================================================
  - !writeStatus: {status: 'Removing bloatware apps'}
  # src: T1-e §3.1 (Atlas appx.yml pattern, GPL-3.0 AtlasOS) · preset: safe (all tiers)

  # Snapshot the current package families BEFORE any removal. The diff after all
  # removals deprovisions exactly the families that disappeared (Atlas trick).
  # Must run as the real user (Get-AppxPackage is per-user), not TrustedInstaller.
  - !powerShell:
    command: |
      New-Item -ItemType Directory -Force -Path """$([Environment]::GetFolderPath('Windows'))\UltraOS""" | Out-Null
      (Get-AppxPackage).PackageFamilyName |
        Out-File """$([Environment]::GetFolderPath('Windows'))\UltraOS\AppxPackagesOld.txt"""
    runas: currentUserElevated
    wait: true
  # src: T1-e §2.4 (Atlas appx.yml parity, GPL-3.0) · preset: safe (infrastructure)

  # ============================ SAFE TIER (every preset) ===============================
  # Deprecated / retired / dead apps only (T1-e §5.9 Safe). No usable app is touched.
  # Most of these are already absent on 24H2+; the patterns exist to catch leftovers
  # on systems upgraded from older builds (Atlas ships the same no-op patterns).

  # Legacy consumer Teams (pre-23H2, dead) - kill before remove per T1-e §6.1
  - !taskKill: {name: 'msteams*', ignoreErrors: true}
  # src: T1-e §5.2 + §6.1 (Atlas kill-before-remove) · preset: safe
  - !appx: {name: 'MicrosoftTeams*', type: family}
  # src: T1-e §5.2 · preset: safe (legacy consumer Teams, not in 23H2+)

  # Cortana app, retired by Microsoft (2024 EEA / 2025 fully; T1-e §8.13). Both real
  # package IDs are swept: F5F10 (Store-era, 26H2-relevant) + F8F0 (Win10-era no-op).
  - !appx: {name: 'Microsoft.549981C3F5F10*', type: family}
  - !appx: {name: 'Microsoft.549981C3F8F0*', type: family}
  # src: T1-e §8.13 · preset: safe

  - !appx: {name: 'Microsoft.SkypeApp*', type: family}
  # src: T1-e §5.1 · preset: safe (Skype UWP, delisted/retired)
  - !appx: {name: 'Microsoft.Office.OneNote*', type: family}
  # src: T1-e §5.1 · preset: safe (UWP OneNote delisted; win32 OneNote is separate)
  - !appx: {name: 'Microsoft.MSPaint*', type: family}
  # src: T1-e §5.1 · preset: safe (Paint 3D, delisted - Paint itself is kept)
  - !appx: {name: 'Microsoft.Microsoft3DViewer*', type: family}
  # src: T1-e §5.1 · preset: safe (3D Viewer, delisted)
  - !appx: {name: 'Microsoft.MixedReality.Portal*', type: family}
  # src: T1-e §5.1 · preset: safe (Mixed Reality Portal, delisted)
  - !appx: {name: 'microsoft.windowscommunicationsapps*', type: family}
  # src: T1-e §5.1 · preset: safe (Mail and Calendar - Microsoft removed it in 24H2)
  - !appx: {name: 'Microsoft.Getstarted*', type: family}
  # src: T1-e §5.1 + §8.10 · preset: safe (Tips, deprecated per Atlas; "Get Started")
  - !appx: {name: 'Microsoft.XboxApp*', type: family}
  # src: T1-e §5.1 · preset: safe (Xbox Console Companion, deprecated by MS - NOT the
  # current Xbox app Microsoft.GamingApp, which is only touched in Extreme)

  # ====================== BALANCED TIER (option: !preset-safe) =========================
  # Atlas 35-family parity (T1-e §3.1) minus Snipping Tool, Edge (own opt-in file),
  # Widgets (policy-disabled at lower tiers, appx removal is Extreme), Phone Link
