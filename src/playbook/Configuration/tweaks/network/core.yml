---
title: Network Core (LLMNR, SMB Hardening)
description: >-
  Disables the insecure LLMNR name-resolution protocol, restricts anonymous
  SMB share access and enumeration, and disables SMB bandwidth throttling
  for faster large file transfers. Atlas-parity network hardening.
# Balanced tier: runs under Balanced and Extreme, skipped under Safe.
# Note: T1-g section 7 mapped LLMNR-off to every tier, but 03-build-manifest
# assigns the whole core file to the Balanced tier - the manifest wins here.
option: '!preset-safe'
actions:
  - !writeStatus: {status: 'Hardening network protocols (LLMNR, SMB)'}

  # LLMNR off - Link-Local Multicast Name Resolution is a spoofing vector
  # and has been replaced by DNS. Atlas ships this file but keeps it DISABLED
  # in tweaks.yml ("Needed for compatibility"): turning LLMNR off can break
  # .local-style name resolution for older devices/discovery on small LANs
  # without DNS. UltraOS applies it at Balanced+ per T1-g section 5.2 - if
  # you depend on legacy LAN name discovery, comment this action out.
  # src: T1-g section 5.2 - Atlas tweaks/networking/disable-llmnr.yml (GPL-3.0) - preset: balanced
  # https://admx.help/?Category=Windows_11_2022&Policy=Microsoft.Policies.DNSClient::Turn_Off_Multicast
  - !registryValue:
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    value: 'EnableMulticast'
    data: '0'
    type: REG_DWORD

  # Restrict anonymous access to named pipes and shares (STIG V-220932).
  # Trade-off: only affects environments that rely on null-session share
  # access, which is exactly the legacy feature being locked out.
  # src: T1-g section 5.3 - Atlas tweaks/networking/shares/restrict-anonymous-access.yml (GPL-3.0) - preset: balanced
  # https://www.stigviewer.com/stig/microsoft_windows_10/2022-04-08/finding/V-220932
  - !registryValue:
    path: 'HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters'
    value: 'RestrictNullSessAccess'
    data: '1'
    type: REG_DWORD

  # Restrict anonymous enumeration of shares (STIG V-220930) - null-session
  # hardening, Atlas restrict-anonymous-enumeration parity.
  # src: T1-g section 5.3 - Atlas tweaks/networking/shares/restrict-anonymous-enumeration.yml (GPL-3.0) - preset: balanced
  # https://www.stigviewer.com/stig/microsoft_windows_10/2022-04-08/finding/V-220930
  - !registryValue:
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa'
    value: 'RestrictAnonymous'
    data: '1'
    type: REG_DWORD

  # Restrict anonymous enumeration of SAM accounts (STIG V-220929) - companion
  # hardening (integration fix: reassigned to network module by main agent,
  # per T3-e/T3-h handoff note in worklog).
  # src: T1-g section 5.3 - Atlas tweaks/networking/shares/restrict-anonymous-enumeration.yml (GPL-3.0) - preset: balanced
  # https://www.stigviewer.com/stig/microsoft_windows_10/2022-04-08/finding/V-220929
  - !registryValue:
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa'
    value: 'RestrictAnonymousSAM'
    data: '1'
    type: REG_DWORD

  # Disable SMB client bandwidth throttling - removes SMB's 10 ms
  # latency-induced throttle on large transfers; genuine throughput win for
  # big file copies on gigabit+ LANs. Irrelevant for gaming latency.
  # src: T1-g section 5.3 - Atlas tweaks/networking/shares/disable-smb-bandwidth-throttling.yml (GPL-3.0) - preset: balanced
  # https://learn.microsoft.com/en-us/windows-server/administration/performance-tuning/role/file-server
  - !registryValue:
    path: 'HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
    value: 'DisableBandwidthThrottling'
    data: '1'
    type: REG_DWORD
