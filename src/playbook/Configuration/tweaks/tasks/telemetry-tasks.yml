---
title: Disable Telemetry Scheduled Tasks
description: >-
  SAFE tier: disables pure data-collection scheduled tasks (CEIP family,
  compatibility appraiser, error-reporting, disk-diagnostic and volume-check
  feedback uploaders). These tasks only feed Microsoft telemetry pipelines;
  disabling them is fully reversible and has no functional impact.
# No option gate - SAFE tier runs under every preset (01-architecture section 4).
# Every task gets ignoreErrors: true: several Win10-era tasks no longer exist on
# Win11 24H2/25H2/26H2 installs (T1-f section 3, "Note on 26H2-era reality").
actions:
  - !writeStatus: {status: 'Disabling telemetry scheduled tasks'}

  # --- Customer Experience Improvement Program (CEIP) family ---

  # CEIP OS data upload (consolidated SQM telemetry upload)
  # src: T1-f section 3 (Atlas + winutil catalog) · preset: safe
  - !scheduledTask: {path: '\Microsoft\Windows\Customer Experience Improvement Program\Consolidator', operation: disable, ignoreErrors: true}

  # CEIP USB device telemetry
  # src: T1-f section 3 (Atlas + winutil catalog) · preset: safe
  - !scheduledTask: {path: '\Microsoft\Windows\Customer Experience Improvement Program\UsbCeip', operation: disable, ignoreErrors: true}

  # CEIP kernel telemetry - Win10-era task, frequently absent on Win11 24H2+
  # ⚠️ UNVERIFIED existence on 26H2 (classic community source only), hence ignoreErrors
  # src: T1-f section 3 · preset: safe
  - !scheduledTask: {path: '\Microsoft\Windows\Customer Experience Improvement Program\KernelCeipTask', operation: disable, ignoreErrors: true}

  # --- Application Experience (CompatTelRunner / CEIP) ---

  # Compatibility appraiser - CompatTelRunner.exe upgrade-readiness telemetry,
  # one of the heaviest background scanners; only feeds feature-update
  # readiness data, disabling never blocks updates themselves
  # src: T1-f section 3 (winutil ISO list + classic tenforums) · preset: safe
  - !scheduledTask: {path: '\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser', operation: disable, ignoreErrors: true}

  # CEIP program-data upload
  # src: T1-f section 3 (winutil ISO list) · preset: safe
  - !scheduledTask: {path: '\Microsoft\Windows\Application Experience\ProgramDataUpdater', operation: disable, ignoreErrors: true}

  # --- Error reporting and diagnostics uploaders ---

  # Windows Error Reporting queue upload - crash-dump upload stops (intended);
  # local crash dumps are still written, only the upload queue task is disabled
  # src: T1-f section 3 (winutil ISO list) · preset: safe
  - !scheduledTask: {path: '\Microsoft\Windows\Windows Error Reporting\QueueReporting', operation: disable, ignoreErrors: true}

  # Disk diagnostic data collection
  # src: T1-f section 3 (Atlas disable-scheduled-tasks.yml, GPL-3.0) · preset: safe
  - !scheduledTask: {path: '\Microsoft\Windows\DiskDiagnostic\Microsoft-Windows-DiskDiagnosticDataCollector', operation: disable, ignoreErrors: true}

  # --- Volume dirty-bit / filesystem-check feedback proxies ---

  # Autochk feedback upload (classic community source, may be absent)
  # src: T1-f section 3 · preset: safe
  - !scheduledTask: {path: '\Microsoft\Windows\Autochk\Proxy', operation: disable, ignoreErrors: true}

  # Chkdsk telemetry proxy
  # src: T1-f section 3 (winutil ISO list) · preset: safe
  - !scheduledTask: {path: '\Microsoft\Windows\Chkdsk\Proxy', operation: disable, ignoreErrors: true}
